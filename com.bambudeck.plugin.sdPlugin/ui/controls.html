<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Bambu Deck</title>
<script src="./libs/sdpi-components.js"></script>
<style>
.hint{color:#9d9a94;font-size:11px;line-height:1.5;padding:4px 0 8px}
.hint b{color:#B9DD8C;font-weight:600}
details{margin:6px 0;border-top:1px solid #333;padding-top:6px}
summary{cursor:pointer;color:#ddd;font-size:12px;padding:4px 0}
</style>
</head>
<body>
<sdpi-item label="Drucker"><sdpi-select setting="printer" default=""><option value="">Erster Drucker</option><option value="1">Drucker 1</option><option value="2">Drucker 2</option><option value="3">Drucker 3</option><option value="4">Drucker 4</option><option value="demo-x1c">Demo: X1C + AMS</option><option value="demo-a1mini">Demo: A1 mini + AMS lite</option><option value="demo-h2d">Demo: H2D + AMS 2 Pro + HT</option></sdpi-select></sdpi-item>
<div class="hint">Drücken legt alle Steuerungen über das ganze Deck: Pause, Stopp (halten), Licht, Tempo, Vorheizen, Lüfter, Achsen, Filament laden und entladen. Was dein Drucker nicht hat, fehlt. Auf kleinen Decks blätterst du mit „Weiter“, „Fertig“ führt zurück.</div>
<div class="hint">Drucker richtest du in der Taste <b>Bao (Drucker)</b> ein.</div>
</body>
</html>
