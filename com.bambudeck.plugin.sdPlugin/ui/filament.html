<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Bambu Deck</title>
<script src="./libs/sdpi-components.js"></script>
<style>
/* Same type as the sdpi components, so our own rows look native. */
body{font-family:"Segoe UI",Arial,Roboto,Helvetica,sans-serif;font-size:9pt;color:#969696;-webkit-font-smoothing:antialiased}
.hint{color:#969696;font-size:8.5pt;line-height:1.45;padding:2px 0 8px}
.hint b{color:#d8d8d8;font-weight:600}
.section{color:#d8d8d8;font-weight:600;font-size:9pt;padding:10px 0 4px;margin-top:6px;border-top:1px solid #3d3d3d}
details{margin:0;border-top:1px solid #3d3d3d}
summary{cursor:pointer;list-style:none;color:#d8d8d8;font-weight:600;font-size:9pt;padding:8px 0 6px;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:4px solid #969696;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary .sub{color:#969696;font-weight:400}
</style>
</head>
<body>
<sdpi-item label="Drucker"><sdpi-select setting="printer" default=""><option value="">Erster Drucker</option><option value="1">Drucker 1</option><option value="2">Drucker 2</option><option value="3">Drucker 3</option><option value="4">Drucker 4</option><option value="demo-x1c">Demo: X1C + AMS</option><option value="demo-a1mini">Demo: A1 mini + AMS lite</option><option value="demo-h2d">Demo: H2D + AMS 2 Pro + HT</option></sdpi-select></sdpi-item>
<sdpi-item label="Aktion"><sdpi-select setting="mode" default="unload"><option value="unload">Entladen</option><option value="load">Laden</option></sdpi-select></sdpi-item>
<sdpi-item label="Spule (zum Laden)"><sdpi-select setting="slot" default="A1"><option value="A1">A1</option><option value="A2">A2</option><option value="A3">A3</option><option value="A4">A4</option><option value="B1">B1</option><option value="B2">B2</option><option value="B3">B3</option><option value="B4">B4</option><option value="C1">C1</option><option value="C2">C2</option><option value="C3">C3</option><option value="C4">C4</option><option value="D1">D1</option><option value="D2">D2</option><option value="D3">D3</option><option value="D4">D4</option><option value="HT1">AMS HT 1</option><option value="HT2">AMS HT 2</option><option value="Ext">Externe Spule</option></sdpi-select></sdpi-item>
<div class="hint">Nur wenn nicht gedruckt wird. Die Düse heizt auf die Temperatur der Spule.</div>
<div class="hint">Drucker richtest du in der Taste <b>Bao (Drucker)</b> ein.</div>
</body>
</html>
