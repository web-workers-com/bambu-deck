<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Bambu Deck</title>
<script src="./libs/sdpi-components.js"></script>
<style>
.hint{color:#9d9a94;font-size:11px;line-height:1.5;padding:4px 0 8px}
.hint b{color:#B9DD8C;font-weight:600}
details{margin:6px 0;border-top:1px solid #333;padding-top:6px}
summary{cursor:pointer;color:#ddd;font-size:12px;padding:4px 0}
</style>
</head>
<body>
<sdpi-item label="Drucker"><sdpi-select setting="printer" default=""><option value="">Erster Drucker</option><option value="1">Drucker 1</option><option value="2">Drucker 2</option><option value="3">Drucker 3</option><option value="4">Drucker 4</option><option value="demo-x1c">Demo: X1C + AMS</option><option value="demo-a1mini">Demo: A1 mini + AMS lite</option><option value="demo-h2d">Demo: H2D + AMS 2 Pro + HT</option></sdpi-select></sdpi-item>
<sdpi-item label="Spule"><sdpi-select setting="slot" default="A1"><option value="A1">A1</option><option value="A2">A2</option><option value="A3">A3</option><option value="A4">A4</option><option value="B1">B1</option><option value="B2">B2</option><option value="B3">B3</option><option value="B4">B4</option><option value="C1">C1</option><option value="C2">C2</option><option value="C3">C3</option><option value="C4">C4</option><option value="D1">D1</option><option value="D2">D2</option><option value="D3">D3</option><option value="D4">D4</option><option value="HT1">AMS HT 1</option><option value="HT2">AMS HT 2</option><option value="Ext">Externe Spule</option><option value="active">Die gerade druckt</option></sdpi-select></sdpi-item>
<div class="hint">A bis D sind die AMS in der Reihenfolge am Hub, Spule 1 bis 4 von links. Ohne RFID (Fremdspule) zeigt die Taste ein Fragezeichen statt Prozent.</div>
<div class="hint">Drucker richtest du in der Taste <b>Bao (Drucker)</b> ein.</div>
</body>
</html>
